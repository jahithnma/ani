name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build the 3D game (web bundle)
        run: npm run build

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FamilyWar3D-by-Jahith.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FamilyWar3D-by-Jahith-apk
          path: FamilyWar3D-by-Jahith.apk

      - name: Publish APK as a GitHub release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Family War 3D - build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Family War 3D - Parents vs Sons. Created by Jahith.
            Download `FamilyWar3D-by-Jahith.apk` below and open it on your Android phone
            (allow "Install unknown apps" for your browser / file manager when asked).
          files: FamilyWar3D-by-Jahith.apk
